name: Build iOS

on:
  push:
    branches:
      - ios
      - android
      - master
  pull_request:
    branches:
      - ios
      - android
      - master
  workflow_dispatch:

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  XCODEGEN_VERSION: '2.44.1'
  XCODEGEN_SHA256: a2e905fb68446e9bb4008cdfe2e13e3f176d0cbcca828b71770f8e53fca91b73
  # App Store Connect only takes builds made with the iOS 26 SDK, and every
  # macOS job uses the same Xcode so the tests cover what TestFlight ships.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  go-ios:
    name: Go core for iOS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Localized strings are current
        run: |
          node --test scripts/gen-ios-strings.test.mjs
          node scripts/gen-ios-strings.mjs
          git diff --exit-code apps/ios/PangeaVPN/Resources

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      # arm64 is the device and Apple-silicon simulators, amd64 the Intel simulator.
      - name: Compile-check every iOS arch
        working-directory: daemon
        run: |
          for arch in arm64 amd64; do
            echo "::group::ios/$arch"
            GOOS=ios GOARCH=$arch CGO_ENABLED=0 go build -tags with_utls ./mobile/
            echo "::endgroup::"
          done

      # The ios tag selects the iOS files; GOOS=darwin lets vet load them without cgo.
      - name: Vet the iOS files
        working-directory: daemon
        run: GOOS=darwin CGO_ENABLED=0 go vet -tags ios,with_utls ./mobile/

  core:
    name: Pangeacore.xcframework
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: daemon/go.mod
          cache: false

      - name: Work out the cache keys
        id: keys
        working-directory: daemon
        run: |
          {
            echo "go=$(go env GOVERSION)"
            echo "mobile=$(go list -m -f '{{.Version}}' golang.org/x/mobile)"
            echo "xcode=$(xcodebuild -version | head -n1 | tr -d ' ')"
            echo "modcache=$(go env GOMODCACHE)"
            echo "buildcache=$(go env GOCACHE)"
          } >>"$GITHUB_OUTPUT"

      # The key covers every input of the bind: Go sources, Go and gomobile
      # versions, SDK, and the "v1" recipe revision below.
      - name: Restore the xcframework
        id: framework
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/ios/Frameworks/Pangeacore.xcframework
          key: xcframework-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.go }}-${{ steps.keys.outputs.mobile }}-${{ steps.keys.outputs.xcode }}-${{ hashFiles('daemon/**/*.go', 'daemon/go.mod', 'daemon/go.sum') }}

      - name: Restore the Go caches
        if: steps.framework.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.keys.outputs.modcache }}
            ${{ steps.keys.outputs.buildcache }}
          key: go-ios-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.go }}-${{ hashFiles('daemon/go.sum') }}
          restore-keys: |
            go-ios-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.go }}-

      # Run inside daemon/ so the CLI is built at the version go.mod pins, the
      # same one the bind links against.
      - name: Install gomobile
        if: steps.framework.outputs.cache-hit != 'true'
        working-directory: daemon
        run: go install golang.org/x/mobile/cmd/gomobile golang.org/x/mobile/cmd/gobind

      # Same tags and ldflags as the Android AAR; apps/android/README.md says why.
      # Apple-silicon runners never use an x86_64 simulator slice.
      - name: Build Pangeacore.xcframework
        if: steps.framework.outputs.cache-hit != 'true'
        working-directory: daemon
        run: |
          mkdir -p ../apps/ios/Frameworks
          gomobile bind -target=ios/arm64,iossimulator/arm64 -iosversion=17.0 \
            -tags=with_utls \
            -ldflags=-checklinkname=0 \
            -o ../apps/ios/Frameworks/Pangeacore.xcframework \
            ./mobile

      - name: Package the xcframework
        run: |
          test -d apps/ios/Frameworks/Pangeacore.xcframework
          tar -czf "$RUNNER_TEMP/Pangeacore.tgz" -C apps/ios/Frameworks Pangeacore.xcframework

      - name: Share the xcframework
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pangeacore-xcframework
          path: ${{ runner.temp }}/Pangeacore.tgz
          retention-days: 1
          compression-level: 0
          overwrite: true

  test:
    name: Unit tests
    needs: core
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Newest iPhone on a runtime between the deployment target and this SDK,
      # booted early so its slow first boot overlaps the downloads below.
      - name: Pick an iPhone simulator
        id: sim
        run: |
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          udid=$(xcrun simctl list devices available -j | jq -r \
            --arg sdk "$sdk" --arg min 17.0 '
            def ver: split(".") | map(tonumber);
            [.devices | to_entries[]
              | select(.key | test("SimRuntime\\.iOS-"))
              | .v = (.key | sub(".*SimRuntime\\.iOS-"; "") | gsub("-"; ".") | ver)
              | select(.v >= ($min | ver) and .v <= ($sdk | ver))]
            | sort_by(.v) | reverse
            | [.[].value[] | select(.name | startswith("iPhone"))]
            | .[0].udid // empty')
          if [ -z "$udid" ]; then
            echo "::error::no iPhone simulator for SDK $sdk"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep "$udid"
          echo "udid=$udid" >>"$GITHUB_OUTPUT"
          nohup xcrun simctl boot "$udid" >/dev/null 2>&1 &

      - name: Fetch the xcframework
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pangeacore-xcframework
          path: ${{ runner.temp }}/core

      - name: Unpack the xcframework
        run: |
          mkdir -p apps/ios/Frameworks
          tar -xzf "$RUNNER_TEMP/core/Pangeacore.tgz" -C apps/ios/Frameworks

      - name: Install XcodeGen
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >>"$GITHUB_PATH"

      - name: Generate the Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      - name: Wait for the simulator
        timeout-minutes: 5
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: perl -e 'alarm 240; exec @ARGV' xcrun simctl bootstatus "$SIM_UDID" -b

      - name: Unit tests
        timeout-minutes: 10
        working-directory: apps/ios
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: xcodebuild test -scheme PangeaVPN -destination "id=$SIM_UDID"

  device:
    name: Unsigned device build
    needs: core
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Fetch the xcframework
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pangeacore-xcframework
          path: ${{ runner.temp }}/core

      - name: Unpack the xcframework
        run: |
          mkdir -p apps/ios/Frameworks
          tar -xzf "$RUNNER_TEMP/core/Pangeacore.tgz" -C apps/ios/Frameworks

      - name: Install XcodeGen
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >>"$GITHUB_PATH"

      - name: Generate the Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      # App Store versions are numeric only, so a prerelease suffix is dropped;
      # the build number is Android's versionCode rule (0.8.1 -> 801).
      - name: Read the version
        id: version
        run: |
          version=$(jq -r .version package.json)
          IFS=. read -r major minor patch <<<"${version%%-*}"
          patch=${patch:-0}
          echo "marketing=$major.$minor.$patch" >>"$GITHUB_OUTPUT"
          echo "build=$((major * 10000 + minor * 100 + patch))" >>"$GITHUB_OUTPUT"

      - name: Release build
        timeout-minutes: 12
        working-directory: apps/ios
        env:
          MARKETING: ${{ steps.version.outputs.marketing }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          xcodebuild build -scheme PangeaVPN -configuration Release \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$MARKETING" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

  # Every screen on three iPhone sizes, as PNGs: gh run download <run-id> -n ios-screens
  screens:
    name: Screen gallery
    needs: core
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # One simulator per size; the image ships no SE, so it is created.
      GALLERY_DEVICES: |-
        iPhone SE (3rd generation)
        iPhone 17 Pro
        iPhone 17 Pro Max
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Create the gallery simulators
        id: sims
        run: |
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          runtime=$(xcrun simctl list runtimes available -j | jq -r --arg sdk "$sdk" '
            def mm: split(".") | .[0:2] | join(".");
            first(.runtimes[]
              | select((.identifier | test("SimRuntime\\.iOS-")) and (.version | mm) == ($sdk | mm))
              | .identifier) // empty')
          if [ -z "$runtime" ]; then
            echo "::error::no iOS $sdk simulator runtime"
            xcrun simctl list runtimes
            exit 1
          fi
          udids=()
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            udid=$(xcrun simctl list devices available -j | jq -r --arg rt "$runtime" --arg name "$name" \
              '(.devices[$rt] // []) | map(select(.name == $name)) | .[0].udid // empty')
            if [ -z "$udid" ]; then
              type=$(xcrun simctl list devicetypes -j | jq -r --arg name "$name" \
                'first(.devicetypes[] | select(.name == $name) | .identifier) // empty')
              if [ -z "$type" ]; then
                echo "::error::Xcode has no simulator type named $name"
                exit 1
              fi
              udid=$(xcrun simctl create "$name" "$type" "$runtime")
            fi
            echo "$name: $udid"
            udids+=("$udid")
          done <<<"$GALLERY_DEVICES"
          echo "udids=${udids[*]}" >>"$GITHUB_OUTPUT"

      - name: Fetch the xcframework
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pangeacore-xcframework
          path: ${{ runner.temp }}/core

      - name: Unpack the xcframework
        run: |
          mkdir -p apps/ios/Frameworks
          tar -xzf "$RUNNER_TEMP/core/Pangeacore.tgz" -C apps/ios/Frameworks

      - name: Install XcodeGen
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >>"$GITHUB_PATH"

      - name: Generate the Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      # The header shows the version, so the gallery carries the real one.
      - name: Read the version
        id: version
        run: |
          version=$(jq -r .version package.json)
          IFS=. read -r major minor patch <<<"${version%%-*}"
          echo "marketing=$major.$minor.${patch:-0}" >>"$GITHUB_OUTPUT"

      # Built once, then run per iPhone, so no simulator boots while the compiler holds the CPU.
      - name: Build the gallery tests
        timeout-minutes: 15
        working-directory: apps/ios
        env:
          MARKETING: ${{ steps.version.outputs.marketing }}
        run: |
          # The core is built for Apple-silicon simulators only, so the generic build skips x86_64.
          xcodebuild build-for-testing -scheme PangeaVPN \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$MARKETING"

      # Answers each test's request with a real screenshot, status bar included.
      - name: Start the framebuffer watcher
        env:
          SCREENS: ${{ runner.temp }}/screens
        run: |
          mkdir -p "$SCREENS/.requests"
          nohup bash -c '
            while :; do
              for req in "$1"/.requests/*/*.want; do
                [ -f "$req" ] || continue
                udid=$(basename "$(dirname "$req")")
                target=$(cat "$req")
                xcrun simctl io "$udid" screenshot --type=png --mask=black "$target.part" >/dev/null 2>&1 \
                  && mv -f "$target.part" "$target"
                rm -f "$req"
              done
              sleep 0.1
            done' _ "$SCREENS" >"$RUNNER_TEMP/framebuffer-watcher.log" 2>&1 &

      # One iPhone at a time: three booted simulators starve the 3-core runner and stall boots.
      - name: Render the screens
        timeout-minutes: 40
        working-directory: apps/ios
        env:
          UDIDS: ${{ steps.sims.outputs.udids }}
          TEST_RUNNER_PANGEA_SCREENS_DIR: ${{ runner.temp }}/screens
          TEST_RUNNER_PANGEA_SCREENS_FRAMEBUFFER: '1'
        run: |
          failed=0
          for udid in $UDIDS; do
            echo "::group::$udid"
            xcrun simctl boot "$udid" || true
            if ! perl -e 'alarm 900; exec @ARGV' xcrun simctl bootstatus "$udid" -b; then
              echo "::error::simulator $udid did not finish booting"
              failed=1
              echo "::endgroup::"
              continue
            fi
            xcrun simctl status_bar "$udid" override --time 9:41 \
              --dataNetwork wifi --wifiMode active --wifiBars 3 \
              --cellularMode active --cellularBars 4 \
              --batteryState charged --batteryLevel 100
            # Reduce Motion stops the map orbit and status pulses, so frames hold still.
            xcrun simctl spawn "$udid" defaults write com.apple.Accessibility ReduceMotionEnabled -bool true
            # The first screenshot after a boot is the slow one, so it is taken before any test waits on it.
            xcrun simctl io "$udid" screenshot --type=png "$RUNNER_TEMP/warmup.png" >/dev/null 2>&1 || true
            xcodebuild test-without-building -scheme PangeaVPN \
              -destination "id=$udid" \
              -derivedDataPath "$RUNNER_TEMP/derived" \
              -only-testing:PangeaVPNTests/ScreenGalleryTests \
              -parallel-testing-enabled NO || failed=1
            xcrun simctl shutdown "$udid" || true
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Upload the screen gallery
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ios-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
          overwrite: true

      - name: Point at the download
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/screens"
          count=$(find "$RUNNER_TEMP/screens" -name '*.png' | wc -l | tr -d ' ')
          {
            echo "### Screen gallery: $count PNGs"
            echo '```'
            echo "gh run download $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY -n ios-screens -D ios-screens-$GITHUB_RUN_ID"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

  # Pushes to ios that pass the tests go to TestFlight. apps/ios/README.md lists
  # the secrets and the one-time portal setup.
  testflight:
    name: TestFlight upload
    needs: [core, test]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/ios')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Fetch the xcframework
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pangeacore-xcframework
          path: ${{ runner.temp }}/core

      - name: Unpack the xcframework
        run: |
          mkdir -p apps/ios/Frameworks
          tar -xzf "$RUNNER_TEMP/core/Pangeacore.tgz" -C apps/ios/Frameworks

      - name: Install XcodeGen
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >>"$GITHUB_PATH"

      - name: Generate the Xcode project
        working-directory: apps/ios
        run: xcodegen generate

      # Each upload needs an unseen build number, so the run and attempt are
      # appended to the device build's number (0.8.1 -> 801.57.1).
      - name: Read the version
        id: version
        run: |
          version=$(jq -r .version package.json)
          IFS=. read -r major minor patch <<<"${version%%-*}"
          patch=${patch:-0}
          echo "marketing=$major.$minor.$patch" >>"$GITHUB_OUTPUT"
          echo "build=$((major * 10000 + minor * 100 + patch)).$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT" >>"$GITHUB_OUTPUT"

      # The team ID comes from the profiles, so project.yml never names one.
      - name: Import the distribution certificate and profiles
        id: signing
        env:
          IOS_DIST_P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_TUNNEL_PROFILE_BASE64: ${{ secrets.IOS_TUNNEL_PROFILE_BASE64 }}
        run: |
          for name in IOS_DIST_P12_BASE64 IOS_DIST_P12_PASSWORD IOS_APP_PROFILE_BASE64 IOS_TUNNEL_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set; apps/ios/README.md lists the TestFlight secrets."
              exit 1
            fi
          done

          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$IOS_DIST_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" -P "$IOS_DIST_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          # The identity only counts as valid with Apple's WWDR G3 intermediate present.
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"
          if ! security find-identity -v -p codesigning "$keychain" | grep -q '"Apple Distribution: '; then
            echo "::error::No valid Apple Distribution certificate in IOS_DIST_P12_BASE64."
            exit 1
          fi

          profile_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profile_dir"
          # Installs one profile after checking it is an App Store profile for $2.
          install_profile() {
            echo "$1" | base64 --decode > "$RUNNER_TEMP/$2.mobileprovision"
            security cms -D -i "$RUNNER_TEMP/$2.mobileprovision" > "$RUNNER_TEMP/$2.plist"
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/$2.plist")
            team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/$2.plist")
            app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/$2.plist")
            if [ "$app_id" != "$team.$2" ]; then
              echo "::error::The profile given for $2 is for $app_id."
              exit 1
            fi
            if /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/$2.plist" >/dev/null 2>&1; then
              echo "::error::The profile for $2 lists devices; TestFlight needs an App Store profile."
              exit 1
            fi
            cp "$RUNNER_TEMP/$2.mobileprovision" "$profile_dir/$uuid.mobileprovision"
          }
          install_profile "$IOS_APP_PROFILE_BASE64" org.pangeavpn.app
          app_profile=$uuid
          app_team=$team
          install_profile "$IOS_TUNNEL_PROFILE_BASE64" org.pangeavpn.app.tunnel
          if [ "$team" != "$app_team" ]; then
            echo "::error::The app profile is for team $app_team, the tunnel profile for $team."
            exit 1
          fi
          {
            echo "team=$team"
            echo "app_profile=$app_profile"
            echo "tunnel_profile=$uuid"
          } >>"$GITHUB_OUTPUT"

      # project.yml points each target's profile at these variables.
      - name: Archive
        timeout-minutes: 15
        working-directory: apps/ios
        env:
          MARKETING: ${{ steps.version.outputs.marketing }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          TEAM: ${{ steps.signing.outputs.team }}
          APP_PROFILE: ${{ steps.signing.outputs.app_profile }}
          TUNNEL_PROFILE: ${{ steps.signing.outputs.tunnel_profile }}
        run: |
          xcodebuild archive -scheme PangeaVPN -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/PangeaVPN.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$TEAM" \
            PANGEA_APP_PROFILE="$APP_PROFILE" \
            PANGEA_TUNNEL_PROFILE="$TUNNEL_PROFILE" \
            MARKETING_VERSION="$MARKETING" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      # The build numbers are already unique, so Xcode is told not to bump them.
      - name: Upload to App Store Connect
        timeout-minutes: 15
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MARKETING: ${{ steps.version.outputs.marketing }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
          TEAM: ${{ steps.signing.outputs.team }}
          APP_PROFILE: ${{ steps.signing.outputs.app_profile }}
          TUNNEL_PROFILE: ${{ steps.signing.outputs.tunnel_profile }}
        run: |
          if [ -z "$APPLE_API_KEY_P8_BASE64" ]; then
            echo "::error::APPLE_API_KEY_P8_BASE64 is not set; apps/ios/README.md lists the TestFlight secrets."
            exit 1
          fi
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>org.pangeavpn.app</key><string>$APP_PROFILE</string>
              <key>org.pangeavpn.app.tunnel</key><string>$TUNNEL_PROFILE</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/PangeaVPN.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER"
          echo "Uploaded PangeaVPN $MARKETING ($BUILD_NUMBER). TestFlight lists it once App Store Connect finishes processing." >>"$GITHUB_STEP_SUMMARY"
