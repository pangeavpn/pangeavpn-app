name: Build Desktop Installers

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Create a draft GitHub release with the built installers'
        default: false
        type: boolean

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum

      - name: Install workspace dependencies
        run: npm ci

      # The desktop tests import main-process sources, which resolve
      # @pangeavpn/shared-types through its built dist.
      - name: Build shared types
        run: npm run build --workspace @pangeavpn/shared-types

      - name: Test desktop
        run: npm test --workspace @pangeavpn/desktop

      - name: Vet daemon
        run: go vet ./...
        working-directory: daemon

      # Matrixed because the kill switch splits per OS behind build tags, so a
      # single runner would never compile the other platforms' tests.
      - name: Test daemon
        run: go test ./...
        working-directory: daemon

  build-windows:
    name: Windows (x64 + arm64)
    runs-on: windows-latest
    needs: test
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum

      - name: Install goversioninfo
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0

      # cgo-links the prebuilt pangea_naive.lib (native COFF) for the naive
      # transport. windows-latest ships LLVM; install it only if missing.
      - name: Ensure LLVM (clang-cl) for naive_cgo
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files\LLVM\bin\clang-cl.exe")) {
            choco install llvm --no-progress -y
          }
          & "C:\Program Files\LLVM\bin\clang-cl.exe" --version

      - name: Install workspace dependencies
        run: npm ci

      - name: Build Windows installers
        run: npm run build-bin:windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fail the build rather than quietly shipping the naive stub.
          PANGEA_REQUIRE_NAIVE: '1'

      # A codec Nsis7z cannot decode makes the installer drop binaries in
      # silence, so nothing downstream would notice the payload is unusable.
      - name: Verify Windows installers
        run: node scripts/verify-windows-installer.mjs

      - name: Upload Windows NSIS installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pangeavpn-windows-installers
          path: dist/bin/windows/installer/**/*.exe
          if-no-files-found: error
          retention-days: 14

  build-mac:
    name: macOS (arm64 + x64)
    runs-on: macos-latest
    needs: test
    # Notarization waits up to an hour per pkg, and Apple can be that slow.
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: daemon/go.mod
          cache: true
          cache-dependency-path: daemon/go.sum

      - name: Install workspace dependencies
        run: npm ci

      # PR builds never see the certificates, and fork builds have no secrets;
      # both stay ad-hoc signed. Everything else ships Developer ID signed and notarized.
      - name: Import Developer ID certificates
        if: github.event_name != 'pull_request'
        env:
          MAC_CERTS_P12_BASE64: ${{ secrets.MAC_CERTS_P12_BASE64 }}
          MAC_CERTS_P12_PASSWORD: ${{ secrets.MAC_CERTS_P12_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$MAC_CERTS_P12_BASE64" ]; then
            echo "::warning::MAC_CERTS_P12_BASE64 is not set; building ad-hoc signed installers."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          echo "$MAC_CERTS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certs.p12" -k "$keychain" -P "$MAC_CERTS_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/pkgbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          # The identities only count as valid with Apple's G2 intermediate present.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certs.p12"

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"Developer ID Application: \(.*\)"$/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application certificate in MAC_CERTS_P12_BASE64."
            exit 1
          fi
          if ! security find-certificate -c "Developer ID Installer: $identity" "$keychain" >/dev/null; then
            echo "::error::No Developer ID Installer certificate for $identity in MAC_CERTS_P12_BASE64."
            exit 1
          fi
          echo "MAC_CODESIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

          if [ -n "$APPLE_API_KEY_P8_BASE64" ]; then
            echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary_key.p8"
            {
              echo "APPLE_API_KEY=$RUNNER_TEMP/notary_key.p8"
              echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
              echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            } >> "$GITHUB_ENV"
          else
            echo "::warning::APPLE_API_KEY_P8_BASE64 is not set; installers are signed but not notarized."
          fi

      - name: Build macOS installers
        run: npm run build-bin:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Identities come from MAC_CODESIGN_IDENTITY (or ad-hoc "-"), never discovery.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # Ad-hoc signing (mac.identity "-") uses no secrets; PR builds skip it otherwise and fail verification.
          CSC_FOR_PULL_REQUEST: 'true'
          # Fail the build rather than quietly shipping the naive stub.
          PANGEA_REQUIRE_NAIVE: '1'

      - name: Remove signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary_key.p8"

      - name: Upload macOS installer DMGs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pangeavpn-mac-installers
          path: dist/bin/mac/installer/**/*-installer.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pangeavpn-windows-installers
          path: artifacts/windows

      - name: Download macOS installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: pangeavpn-mac-installers
          path: artifacts/mac

      - name: Flatten into release directory
        run: |
          mkdir -p release
          find artifacts/windows -type f -name '*.exe' -exec cp {} release/ \;
          find artifacts/mac -type f -name '*-installer.dmg' -exec cp {} release/ \;
          ls -la release/

      # Releases are not code-signed yet, so published checksums are the only
      # integrity check users have. Generated here, from the same artifacts that
      # are uploaded, in a public log.
      - name: Generate SHA-256 checksums
        working-directory: release
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(*.exe *.dmg)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "::error::No release artifacts found to checksum"
            exit 1
          fi
          # Explicit extensions rather than '*' so SHA256SUMS.txt can never
          # list itself, regardless of shell expansion order.
          sha256sum "${artifacts[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Immutable releases reject asset uploads once published, so upload to a
      # draft first and flip it live in the next step.
      - name: Create draft release with assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  # GITHUB_TOKEN publishes the release, so its event cannot start the notes
  # workflow (recursion guard). Call it directly: same run graph, no PAT.
  release-notes:
    name: AI Release Notes
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/ai-release-notes.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
