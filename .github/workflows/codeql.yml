name: "CodeQL Advanced"

on:
  push:
    branches: [ "master", "android" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [ "master", "android" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  schedule:
    # Weekly drift check, catches new CodeQL rules against unchanged code.
    - cron: '33 18 * * 0'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Only used to build the AAR that Gradle needs to configure; naive is not
  # linked here, so this need only track build-android.yml loosely.
  ANDROID_NDK: '30.0.14904198'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }}${{ matrix.goos && format(', {0}', matrix.goos) || '' }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Workflow files themselves: script injection, unpinned actions, etc.
          - language: actions
            build-mode: none
            runs-on: ubuntu-latest

          # Electron main + renderer + shared-types.
          - language: javascript-typescript
            build-mode: none
            runs-on: ubuntu-latest

          # Go daemon, one variant per target OS so build-tagged files
          # (internal/wg, internal/platform kill switch, etc.) get analyzed.
          - language: go
            build-mode: manual
            runs-on: ubuntu-latest
            goos: linux

          - language: go
            build-mode: manual
            runs-on: windows-latest
            goos: windows

          - language: go
            build-mode: manual
            runs-on: macos-latest
            goos: darwin

          # daemon/mobile is entirely //go:build android, so the three desktop
          # variants above never see it. Only ./mobile/... builds for android.
          - language: go
            build-mode: manual
            runs-on: ubuntu-latest
            goos: android
            goarch: arm64
            build-target: ./mobile/...

          # apps/android Kotlin. build-mode none extracts Java but not Kotlin,
          # and this tree is all Kotlin, so it has to be a real Gradle compile.
          - language: java-kotlin
            build-mode: manual
            runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        if: matrix.language == 'go' || matrix.language == 'java-kotlin'
        uses: actions/setup-go@v7
        with:
          go-version-file: 'daemon/go.mod'
          cache: true
          cache-dependency-path: 'daemon/go.sum'

      # :core resolves the gomobile AAR as a module, so Gradle cannot even
      # configure without it. Built before init: it is Go, not Kotlin.
      - name: Set up the Android build
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@v3

      # Keep in step with ANDROID_NDK in build-android.yml.
      - name: Install the NDK
        if: matrix.language == 'java-kotlin'
        run: sdkmanager --install "ndk;${{ env.ANDROID_NDK }}"

      - name: Build the gomobile AAR
        if: matrix.language == 'java-kotlin'
        working-directory: daemon
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK }}
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          mkdir -p ../apps/android/core/libs
          gomobile bind -target=android/arm64 -androidapi 24 \
            -javapkg=org.pangeavpn \
            -ldflags=-checklinkname=0 \
            -o ../apps/android/core/libs/pangeacore.aar \
            ./mobile

      - name: Set up Node
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
        continue-on-error: true  # Fine if .nvmrc isn't present, CodeQL doesn't need npm install.

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality
          # Uncomment to ignore generated files or vendored deps:
          # config-file: ./.github/codeql/codeql-config.yml

      - name: Build Go daemon
        if: matrix.language == 'go'
        shell: bash
        working-directory: daemon
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          BUILD_TARGET: ${{ matrix.build-target }}
          CGO_ENABLED: 0
        run: |
          # Empty is not a valid GOARCH, so let Go pick its own default.
          [ -n "$GOARCH" ] || unset GOARCH
          target="${BUILD_TARGET:-./...}"
          echo "Building Go daemon for GOOS=$GOOS GOARCH=${GOARCH:-host} target=$target"
          go build -trimpath -buildvcs=false "$target"

      # compileDebugKotlin, not assemble: extraction needs the compiler to run,
      # not an APK. Pulls in :core and :ui-common as dependencies.
      - name: Compile Kotlin
        if: matrix.language == 'java-kotlin'
        working-directory: apps/android
        run: ./gradlew --no-daemon :app-mobile:compileDebugKotlin :app-tv:compileDebugKotlin

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}${{ matrix.goos && format('-{0}', matrix.goos) || '' }}"
          upload: always
