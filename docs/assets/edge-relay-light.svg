<svg xmlns="http://www.w3.org/2000/svg" width="960" height="372" viewBox="0 0 960 372" role="img" aria-labelledby="title desc">
<title id="title">Why the edge relay exists</title>
<desc id="desc">A censor that enumerates and null-routes Pangea's own IP addresses blocks the cached IP, the DoH-resolved IP, the REALITY and Shadowsocks proxies and plain HTTPS at once. The edge relay sits on CDN anycast space shared with much of the web, and forwards the sealed envelope to the hub.</desc>
<style>
